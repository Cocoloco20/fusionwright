[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusionwright"
version = "0.1.0"
description = "Open-source MCP server that lets an AI model, verify, render and export anything in your live Autodesk Fusion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Luigui Sánchez Soca" }]
keywords = ["mcp", "fusion", "autodesk", "fusion-360", "cad", "3d-modeling", "step", "ai-agents"]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fusionwright = "fusionwright.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fusionwright"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
