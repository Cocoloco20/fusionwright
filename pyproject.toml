[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusionwright"
version = "0.1.0"
description = "Open-source MCP server that lets AI model, verify and export anything in Autodesk Fusion, or with no CAD software at all."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Luigui Sánchez Soca" }]
keywords = ["mcp", "fusion", "autodesk", "cad", "3d-modeling", "cadquery", "step", "ai-agents", "woodworking"]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
cad = ["cadquery>=2.4", "numpy", "pillow"]    # open-source CAD backend: no Autodesk software needed
dev = ["pytest"]

[project.scripts]
fusionwright = "fusionwright.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fusionwright"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
